# Build del backend para Cloud Run usando backend/Dockerfile.
# Uso: gcloud builds submit --config cloudbuild.yaml \
#        --substitutions=_IMAGE=us-central1-docker.pkg.dev/PROYECTO/neza/neza-backend-api
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-f", "backend/Dockerfile", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
